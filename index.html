<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadMatch — Your next read, picked for your mood</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-stone-800 min-h-screen flex flex-col">

  <header class="border-b border-stone-200/60 bg-[#FAF8F5]/90 backdrop-blur sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <h1 class="font-serif text-2xl font-bold tracking-tight text-stone-900">ReadMatch<span class="text-[#E05A87]">.</span></h1>
      <div class="flex items-center gap-4">
        <button onclick="abrirModalCadastro()" class="text-xs font-semibold bg-stone-900 hover:bg-stone-800 text-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 cursor-pointer">
          <span>🔍</span> Buscar & Cadastrar
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10 flex-1 w-full space-y-10">
    <!-- Dashboard Top: Diário + Meta de Leitura -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Card Mensagem -->
      <div class="md:col-span-2 space-y-4 bg-white p-6 sm:p-8 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between">
        <div>
          <span class="text-xs uppercase font-bold tracking-wider text-[#E05A87]">Diário de Leitura</span>
          <h2 class="text-3xl font-bold text-stone-900 mt-1">Oi, Bia! 📚</h2>
          <p class="text-stone-500 max-w-md mt-1">Você tem <span id="contador-livros" class="font-bold text-stone-800">0</span> livros cadastrados na sua biblioteca.</p>
        </div>
        <div>
          <button onclick="iniciarQuiz()" class="bg-[#E05A87] hover:bg-[#C94672] text-white font-semibold px-6 py-3.5 rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 text-sm cursor-pointer w-full sm:w-auto">
            ✨ O que eu leio agora?
          </button>
        </div>
      </div>

      <!-- Card Meta de Leitura -->
      <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs uppercase font-bold tracking-wider text-[#E05A87]">Meta de Leitura</span>
          <button onclick="alterarMeta()" class="text-[11px] font-semibold text-stone-500 hover:text-[#E05A87] underline cursor-pointer">Alterar meta</button>
        </div>
        
        <div class="space-y-2">
          <div class="flex items-baseline justify-between">
            <span class="text-3xl font-bold text-stone-900" id="meta-progresso">0 / 12</span>
            <span class="text-xs font-bold text-[#E05A87]" id="meta-porcentagem">0%</span>
          </div>
          <p class="text-xs text-stone-500">livros lidos em <span id="ano-atual">2026</span></p>
          
          <!-- Barra de Progresso -->
          <div class="w-full bg-stone-100 h-3 rounded-full overflow-hidden border border-stone-200/60">
            <div id="meta-barra" class="bg-[#E05A87] h-full rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>

        <p class="text-[11px] text-stone-400 italic" id="meta-mensagem">Falta pouco para atingir sua meta!</p>
      </div>

    </section>

    <!-- Estante com Filtros -->
    <section class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h3 class="font-serif text-xl font-bold text-stone-900">Sua Estante</h3>
        
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
          <button onclick="filtrarEstante('todos')" id="btn-filtro-todos" class="btn-filtro font-semibold px-3 py-1.5 rounded-lg bg-stone-900 text-white transition cursor-pointer">Todos</button>
          <button onclick="filtrarEstante('quero_ler')" id="btn-filtro-quero_ler" class="btn-filtro font-semibold px-3 py-1.5 rounded-lg bg-stone-100 text-stone-600 hover:bg-stone-200 transition cursor-pointer">Quero Ler</button>
          <button onclick="filtrarEstante('lendo')" id="btn-filtro-lendo" class="btn-filtro font-semibold px-3 py-1.5 rounded-lg bg-stone-100 text-stone-600 hover:bg-stone-200 transition cursor-pointer">Lendo</button>
          <button onclick="filtrarEstante('lido')" id="btn-filtro-lido" class="btn-filtro font-semibold px-3 py-1.5 rounded-lg bg-stone-100 text-stone-600 hover:bg-stone-200 transition cursor-pointer">Lidos</button>
          <button onclick="filtrarEstante('favoritos')" id="btn-filtro-favoritos" class="btn-filtro font-semibold px-3 py-1.5 rounded-lg bg-stone-100 text-stone-600 hover:bg-stone-200 transition cursor-pointer">❤️ Favoritos</button>
          
          <button onclick="escolherPorMim()" class="text-xs font-semibold text-[#E05A87] hover:bg-pink-50 px-3 py-1.5 rounded-lg transition border border-[#E05A87]/30 ml-auto cursor-pointer">
            Escolher por mim 🎲
          </button>
        </div>
      </div>

      <div id="grid-livros" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6"></div>
    </section>
  </main>

  <!-- Modal Quiz -->
  <div id="modal-quiz" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-xl w-full rounded-2xl p-6 sm:p-8 shadow-xl border border-stone-200 relative">
      <button onclick="fecharQuiz()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 text-lg font-bold p-2 cursor-pointer">✕</button>
      <div id="quiz-container"></div>
    </div>
  </div>

  <!-- Modal Cadastrar Livro com Google Books -->
  <div id="modal-cadastro" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-lg w-full rounded-2xl p-6 sm:p-8 shadow-xl border border-stone-200 relative max-h-[90vh] flex flex-col">
      <button onclick="fecharModalCadastro()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 text-lg font-bold p-2 cursor-pointer">✕</button>
      <h3 class="font-serif text-2xl font-bold text-stone-900 mb-4">Adicionar Novo Livro</h3>
      
      <form onsubmit="buscarLivrosAPI(event)" class="flex gap-2 mb-4">
        <input type="text" id="input-busca-api" placeholder="Digite o título ou autor..." class="flex-1 border border-stone-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#E05A87]">
        <button type="submit" id="btn-buscar-api" class="bg-stone-900 hover:bg-stone-800 text-white font-semibold px-4 py-2.5 rounded-lg text-sm transition cursor-pointer">
          Buscar
        </button>
      </form>

      <div id="container-resultados" class="flex-1 overflow-y-auto space-y-3 pr-1 min-h-[150px] max-h-[300px]">
        <p class="text-xs text-stone-400 text-center py-8">Pesquise acima para carregar os dados automaticamente do Google Books.</p>
      </div>
    </div>
  </div>

  <!-- Modal Detalhes do Livro + Minha Experiência -->
  <div id="modal-detalhes" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white max-w-xl w-full rounded-2xl p-6 sm:p-8 shadow-xl border border-stone-200 relative my-8">
      <button onclick="fecharModalDetalhes()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 text-lg font-bold p-2 cursor-pointer">✕</button>
      <div id="detalhes-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
