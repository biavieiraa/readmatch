<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadMatch | Meu Cantinho Literário</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            blush: {
              50: '#fdf2f4',
              100: '#fce7f3',
              200: '#fbcfe8',
              400: '#f472b6',
              500: '#e05a87',
              600: '#c94672',
            },
            cozy: {
              bg: '#faf7f5',
              card: '#ffffff',
              border: '#f3ece7',
              text: '#3d3233',
              muted: '#8c7e7f'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #faf7f5;
      color: #3d3233;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #fbcfe8;
      border-radius: 8px;
    }
  </style>
</head>
<body class="font-sans min-h-screen pb-16">

  <!-- HEADER -->
  <header class="bg-white/90 backdrop-blur-md border-b border-blush-100 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <div class="flex items-center gap-2">
        <span class="text-xl">🎀</span>
        <div>
          <h1 class="font-serif font-bold text-xl text-stone-800 tracking-tight">ReadMatch</h1>
          <p class="text-[11px] text-cozy-muted">Seu organizador de leituras</p>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button onclick="iniciarQuiz()" class="bg-blush-50 hover:bg-blush-100 text-blush-600 border border-blush-100 font-semibold text-xs px-3.5 py-2 rounded-xl transition cursor-pointer">
          ✨ Quiz de Match
        </button>
        <button onclick="escolherPorMim()" class="bg-white hover:bg-stone-50 border border-stone-200 text-stone-700 font-semibold text-xs px-3.5 py-2 rounded-xl transition cursor-pointer">
          🎲 Sorteador
        </button>
        <button onclick="abrirModalCadastro()" class="bg-blush-500 hover:bg-blush-600 text-white font-semibold text-xs px-3.5 py-2 rounded-xl transition cursor-pointer shadow-sm">
          + Adicionar Livro
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-6 space-y-8">

    <!-- META DE LEITURA -->
    <section class="bg-white p-5 rounded-2xl border border-blush-100 shadow-sm relative overflow-hidden">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="space-y-1">
          <span class="text-[11px] font-bold uppercase tracking-wider text-blush-500">Meta Anual 🎯</span>
          <h2 class="font-serif text-xl font-bold text-stone-800">Desafio Literário</h2>
          <p id="meta-mensagem" class="text-xs text-cozy-muted">Carregando dados...</p>
        </div>

        <div class="w-full md:w-72 bg-blush-50/50 p-3.5 rounded-xl border border-blush-100 space-y-2">
          <div class="flex justify-between items-center text-xs font-semibold">
            <span class="text-stone-700">Lidos</span>
            <span id="meta-progresso" class="text-blush-600 font-bold">0 / 12</span>
          </div>
          <div class="w-full bg-white h-2.5 rounded-full overflow-hidden border border-blush-100 p-0.5">
            <div id="meta-barra" class="bg-blush-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <div class="flex justify-between items-center text-[11px]">
            <span id="meta-porcentagem" class="text-cozy-muted font-medium">0% concluído</span>
            <button onclick="alterarMeta()" class="text-blush-600 font-semibold hover:underline cursor-pointer">Alterar meta</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ESTANTE & FILTROS -->
    <section class="space-y-5">
      
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-blush-100 pb-3">
        <div>
          <h3 class="font-serif font-bold text-lg text-stone-800 flex items-center gap-2">
            Minha Estante <span id="contador-livros" class="text-xs font-sans bg-blush-100 text-blush-600 px-2 py-0.5 rounded-full font-bold">0</span>
          </h3>
        </div>

        <div class="flex flex-wrap gap-1 bg-white p-1 rounded-xl border border-stone-200 text-xs font-medium">
          <button id="btn-filtro-todos" onclick="filtrarEstante('todos')" class="btn-filtro px-3 py-1 rounded-lg transition cursor-pointer">Todos</button>
          <button id="btn-filtro-lendo" onclick="filtrarEstante('lendo')" class="btn-filtro px-3 py-1 rounded-lg transition cursor-pointer">📖 Lendo</button>
          <button id="btn-filtro-quero_ler" onclick="filtrarEstante('quero_ler')" class="btn-filtro px-3 py-1 rounded-lg transition cursor-pointer">💭 Quero Ler</button>
          <button id="btn-filtro-lido" onclick="filtrarEstante('lido')" class="btn-filtro px-3 py-1 rounded-lg transition cursor-pointer">💖 Lidos</button>
          <button id="btn-filtro-favoritos" onclick="filtrarEstante('favoritos')" class="btn-filtro px-3 py-1 rounded-lg transition cursor-pointer">👑 Favoritos</button>
        </div>
      </div>

      <!-- GRID DE LIVROS -->
      <div id="grid-livros" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      </div>

    </section>

  </main>

  <!-- MODAL: BUSCAR LIVRO -->
  <div id="modal-cadastro" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-xl border border-blush-100 space-y-4">
      
      <div class="flex justify-between items-start">
        <div>
          <h3 class="font-serif font-bold text-lg text-stone-800">Adicionar Livro</h3>
          <p class="text-xs text-cozy-muted">Pesquise por título ou autor para carregar a capa e os dados</p>
        </div>
        <button onclick="fecharModalCadastro()" class="text-stone-400 hover:text-stone-600 text-base">✕</button>
      </div>

      <form onsubmit="buscarLivrosAPI(event)" class="flex gap-2">
        <input type="text" id="input-busca-api" placeholder="Ex: A Hipótese do Amor, Colleen Hoover..." class="flex-1 bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-blush-400 font-medium">
        <button type="submit" id="btn-buscar-api" class="bg-blush-500 hover:bg-blush-600 text-white font-semibold text-xs px-4 py-2 rounded-xl transition cursor-pointer">
          Buscar
        </button>
      </form>

      <div id="container-resultados" class="space-y-2 max-h-64 overflow-y-auto custom-scroll pr-1">
        <p class="text-xs text-cozy-muted text-center py-8">Digite o nome de um livro acima para pesquisar.</p>
      </div>

    </div>
  </div>

  <!-- MODAL: DETALHES -->
  <div id="modal-detalhes" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-xl border border-blush-100 space-y-4 relative max-h-[90vh] overflow-y-auto custom-scroll">
      <button onclick="fecharModalDetalhes()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 text-base">✕</button>
      <div id="detalhes-container"></div>
    </div>
  </div>

  <!-- MODAL: QUIZ / SORTEADOR -->
  <div id="modal-quiz" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl border border-blush-100 relative">
      <button onclick="fecharQuiz()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 text-base">✕</button>
      <div id="quiz-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
